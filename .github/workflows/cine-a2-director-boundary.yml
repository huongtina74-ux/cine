name: CINE A2 — Script Lock to 10s Director and External Skill Reference Safety
on:
  pull_request:
    paths:
      - 'tools/cf_a2_director_bridge.py'
      - 'tools/cf_a2_story_contract.py'
      - 'config/story_factory/a2_bell_leaf_external_skill_sources.json'
      - 'config/niches/slow_english_a2/RESEARCH_TO_SCRIPT_INTEGRATION.md'
      - 'tests/test_cine_a2_director_bridge.py'
  push:
    branches: [main]
    paths:
      - 'tools/cf_a2_director_bridge.py'
      - 'config/story_factory/a2_bell_leaf_external_skill_sources.json'
      - 'tests/test_cine_a2_director_bridge.py'
jobs:
  director-boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies for the existing CineFactory Studio resolver
        run: python -m pip install -e . 'Pillow>=10,<13'
      - name: Test script hash gate and shot-to-director interface
        run: |
          python -m compileall -q tools/cf_a2_director_bridge.py
          python -m unittest discover -s tests -p test_cine_a2_director_bridge.py -v

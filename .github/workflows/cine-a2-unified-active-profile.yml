name: CINE Slow English A2 — unified visual/toolkit Canon
on:
  pull_request:
    paths:
      - 'cinefactory/slow_english_unified.py'
      - 'cinefactory/niche_tools.py'
      - 'cinefactory/prompt_pack.py'
      - 'config/niches/slow_english_a2/visual_bible.yaml'
      - 'config/niches/slow_english_a2/toolkit.yaml'
      - 'tools/cf_a2_external_craft.py'
      - 'tools/cf_a2_claude_agent.py'
      - 'tests/test_slow_english_a2_active_unification.py'
      - 'tests/test_cine_a2_claude_agent.py'
  push:
    branches: [main]
    paths:
      - 'cinefactory/slow_english_unified.py'
      - 'config/niches/slow_english_a2/visual_bible.yaml'
      - 'config/niches/slow_english_a2/toolkit.yaml'
      - 'tests/test_slow_english_a2_active_unification.py'
jobs:
  canon-production-router:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup deterministic YAML and CINE code
        run: python -m pip install PyYAML
      - name: Confirm source-of-truth and guarded media routing
        run: |
          python -m compileall -q cinefactory/slow_english_unified.py cinefactory/prompt_pack.py cinefactory/niche_tools.py tools/cf_a2_external_craft.py tools/cf_a2_claude_agent.py
          python -m cinefactory.slow_english_unified
          python -m unittest discover -s tests -p test_slow_english_a2_active_unification.py -v
          python -m unittest discover -s tests -p test_cine_a2_claude_agent.py -v

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      CINEFACTORY_DATABASE_URL: postgresql+psycopg://cinefactory:cinefactory@postgres:5432/cinefactory
      CINEFACTORY_COMFYUI: http://host.docker.internal:8188
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ../data:/app/data
      - ../workflows:/app/workflows
      - ../models:/app/models
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cinefactory
      POSTGRES_PASSWORD: cinefactory
      POSTGRES_DB: cinefactory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cinefactory
      MINIO_ROOT_PASSWORD: cinefactory-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

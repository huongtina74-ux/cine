# Real CC0 set dressing per environment theme.
# Every pack here must be registered in source_packs.yaml as APPROVED with
# commercial_use: true, or the binder drops its rows.
#
# zone:   backdrop - scattered in a ring around the course
#         start / finish - beside the start or finish platform (one per side)
#         air - floating above the race lanes; spins and pops when an animal runs through
# height: target height in metres (each model is scaled from its own bounds)
# Kid-safe only: no weapons, bombs, spikes, saws, skulls or trademarked items.
version: 1

packs:
  kenney.nature_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_nature-kit/Models/GLTF format
  kenney.platformer_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_platformer-kit/Models/GLB format
  kenney.coaster_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_coaster-kit/Models/GLB format
  kenney.marble_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_marble-kit/Models/GLB format
  kenney.food_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_food-kit/Models/GLB format
  kenney.holiday_kit: data/assets/animal_long_slide/quarantine/kenney/kenney_holiday-kit/Models/GLB format
  quaternius.ultimate_platformer: data/assets/animal_long_slide/quarantine/quaternius/platformer

common:
  - {pack: quaternius.ultimate_platformer, file: Level and Mechanics/Blends/Goal_Flag.blend, zone: finish, count: 2, height: 2.8}
  - {pack: kenney.platformer_kit, file: coin-gold.glb, zone: air, count: 8, height: 0.7}
  - {pack: kenney.marble_kit, file: banner-high.glb, zone: start, count: 2, height: 3.0}


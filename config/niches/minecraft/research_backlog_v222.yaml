technology_study:
  # control: CODE_HEADLESS = Cine runs it without a person; CODE_FILE = Cine writes/reads its files, a person opens and renders;
  # CODE_API_KEY = API with an owner key/OAuth; GUI_ONLY = a person operates it; REPLACED_BY_CINE = an existing Cine tool covers it;
  # POLICY_BLOCKED = conflicts with the original-IP rule; LEARNING_ONLY / UNVERIFIED as named.
  - id: existing_blender_4_5
    control: CODE_HEADLESS
    role: primary_deterministic_voxel_animation
    source: https://www.blender.org/releases/4-5/
    installed_and_version_checked: true
    production_quality_qualified: false
    priority: P0
    gate: "Improve original rig, face, acting, world and lighting; compare same shots after visual signoff."
  - id: blockbench_original_assets
    control: CODE_FILE
    role: original_rigged_model_skin_pixel_uv
    source: https://blockbench.net/wiki/guides/export-formats/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P0
    gate: "Creator-authored original props and GLB/glTF export; validate bones, texture nearest and rights."
  - id: blender_studio_course
    control: LEARNING_ONLY
    role: published_professional_workflow_reference
    source: https://studio.blender.org/training/minecraft-animation-workshop/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P0
    gate: "Course curriculum only read; membership video not watched. Learn world, skin, rig, light, render, audio."
  - id: mineways
    control: UNVERIFIED
    role: original_world_export_to_blender
    source: https://github.com/erich666/Mineways
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "Must own legal game/world source and permission. Test export on Blender 4.5 with original world."
  - id: mcprep
    control: CODE_HEADLESS
    role: blend_world_material_and_mob_preparation
    source: https://github.com/Moo-Ack-Productions/MCprep
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "SOURCE_VERIFIED 2026-11-01: MCprep 3.6.3 states one install for Blender 2.83-5.2. Still needs an isolated Blender 4.5 check on the owner PC before the production worker loads it; no auto-install."
  - id: mineimator
    control: CODE_FILE
    role: owner_priority_block_animation_backend_via_project_file
    source: https://www.mineimator.com/download
    installed_and_version_checked: true  # OBSERVED 2026-11-01: 2.0.2 Full at C:\\Users\\ADMIN\\Mine-imator (Trial would watermark renders)
    production_quality_qualified: false
    priority: P0
    gate: "OWNER 2026-11-01: most important tool. SOURCE_VERIFIED: .miproject is JSON (github.com/stuffbydavid/Mine-imator project_save_*.gml). cinefactory/block_animation/mineimator.py writes a compiled episode into a copy of an owner-made template; still no headless render API, so rendering stays in the Mine-imator UI. Next gate: owner template passes block-mineimator-inspect, then one calibration export opened on the owner PC (axes, camera, audio)."
  - id: replay_mod
    control: GUI_ONLY
    role: in_game_capture_and_free_camera
    source: https://www.replaymod.com/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "Owner plays/acts in an original world; no CineFactory API. Check shader pack licence before monetised use."
  - id: bbs_mod
    control: GUI_ONLY
    role: in_game_actor_playback_and_camera_paths
    source: https://www.curseforge.com/minecraft/mc-mods/bbs-mod
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P2
    gate: "Fabric 1.20+ mod; data files may be scriptable but format unverified. Test on one original scene first."
  - id: mineflayer
    control: CODE_HEADLESS
    role: scripted_bot_actors_on_local_server
    source: https://github.com/PrismarineJS/mineflayer
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P2
    gate: "Only on an owner-run local server with owner accounts/offline mode; never on public servers. Pair with Replay Mod capture."
  - id: mixamo
    control: GUI_ONLY
    role: motion_library_for_blender_rigs
    source: https://www.mixamo.com/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P2
    gate: "Requires owner Adobe login and manual FBX download (no scripted account use). Retarget to Blender rigs; not importable by Mine-imator directly."
  - id: skin_sources
    control: POLICY_BLOCKED
    role: skin_reference_only
    source: https://www.minecraftskins.com/ ; https://vi.namemc.com/ ; https://www.planetminecraft.com/skins ; https://minecraft.novaskin.me/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: HOLD
    gate: "Original IP rule: cast skins are drawn for CineFactory (NovaSkin editor is fine for drawing). Community skins need creator permission; competitor characters (JJ, Mikey, Steve-as-lead) are blocked."
  - id: map_sources
    control: GUI_ONLY
    role: world_and_set_sources
    source: https://www.planetminecraft.com/projects ; https://www.minecraft-maps.com/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "Each map's licence/credit terms recorded before use; prefer CineFactory-built sets. Mine-imator imports schematics/worlds."
  - id: music_sfx_sources
    control: CODE_API_KEY
    role: licensed_music_and_effects
    source: https://incompetech.com/ ; https://freesound.org/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "Incompetech = CC-BY, credit Kevin MacLeod in the description. Freesound: per-sound licence, CC0/CC-BY only, credits recorded by cf_auto_edit."
  - id: voice_tools
    control: REPLACED_BY_CINE
    role: voice_and_character_pitch
    source: https://ttsmaker.com/ ; https://www.audacityteam.org/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P1
    gate: "TTSMaker commercial terms unverified; human or owner-cloned voice preferred. Audacity pitch shift is equivalent to the existing FFmpeg path."
  - id: capcut_pc
    control: REPLACED_BY_CINE
    role: manual_edit_alternative
    source: https://www.capcut.com/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: HOLD
    gate: "No API; tools/cf_auto_edit.py already covers VO, ducked music, SFX, captions and -14 LUFS."
  - id: blender_mcp_community
    control: CODE_HEADLESS
    role: interactive_claude_to_blender_on_owner_pc
    source: https://github.com/ahujasid/blender-mcp
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: P2
    gate: "OBSERVED 2026-11-01: registered on the owner PC as local MCP 'Blender' but Blender was not listening on :9876. Runs arbitrary Python in a live Blender; use for interactive previs/asset checks only, never as the production worker."
  - id: comfyui_local
    control: CODE_HEADLESS
    role: concept_and_optional_hero_visuals_only
    source: https://github.com/Comfy-Org/ComfyUI
    installed_and_version_checked: true
    production_quality_qualified: false
    priority: P2
    gate: "Core app confirmed local API only; persistent 3D character continuity unproven, no paid nodes."
  - id: blender_lab_mcp
    control: CODE_HEADLESS
    role: isolated_claude_3d_scene_commands
    source: https://www.blender.org/lab/mcp-server/
    installed_and_version_checked: false
    production_quality_qualified: false
    priority: HOLD
    gate: "Requires Blender 5.1+, unsandboxed bpy; don't replace existing production 4.5 worker."
  - id: ffmpeg_existing
    control: CODE_HEADLESS
    role: deterministic_local_post_production
    source: https://ffmpeg.org/
    installed_and_version_checked: true
    production_quality_qualified: false
    priority: P0
    gate: "Use existing episode assembler; sound/edit/master benchmark still mandatory."
legal_study:
  - label: Minecraft Usage Guidelines
    source: https://www.minecraft.net/en-us/usage-guidelines
    consequence: "Monetized original creative gameplay/video allowed under specific free-view/ad revenue conditions, not blanket IP licensing."
  - label: Maizen fan character guidelines
    source: https://maizen.com/usage-guidelines/
    consequence: "Limited conditioned allowance for free-view fan videos and ad revenue; not ownership of JJ/Mikey brand/characters. Prefer first-party cast."
  - label: YouTube channel monetization guidelines
    source: https://support.google.com/youtube/answer/1311392
    consequence: "Repetitive inauthentic mass-produced videos can lose monetization even if made with original Blender render."
pilot_plan:
  title: The Lost Lantern - ORIGINAL Minecraft-inspired mystery
  objective: "Demonstrate acting, environment, character and audio quality in a 45-second original conflict/reveal/payoff."
  duration_seconds: 45
  target_resolution: [1920, 1080]
  fps: 24
  language: English
  originality: "Original 'Nova' and 'Pip' characters; no JJ, Mikey, Steve, Herobrine or copied branding."
  shot_beats:
    - {id: A01, seconds: 4, beat: "Forest lantern mysteriously goes dark; establish stakes", camera: "wide_push", needs: [world, light_cue, night_forest, original_sfx]}
    - {id: A02, seconds: 4, beat: "Nova notices light missing and looks at Pip", camera: "reaction_medium", needs: [gaze, head_turn, facial_expression]}
    - {id: A03, seconds: 4, beat: "Pip hears whisper; turns with fear", camera: "closeup", needs: [brow, blink, mouth, gesture, foley]}
    - {id: A04, seconds: 5, beat: "They follow a trail into a cave", camera: "moving_two_shot", needs: [walk_cycle, footplant, parallax_world]}
    - {id: A05, seconds: 5, beat: "Suspense grows at doorway, dialogue warning", camera: "over_shoulder", needs: [dialogue, phonemes, footsteps, prop_sockets]}
    - {id: A06, seconds: 5, beat: "Glowing orb revealed; characters react differently", camera: "wide_reveal", needs: [light_transition, reaction_clips, world_prop]}
    - {id: A07, seconds: 5, beat: "Nova reaches out, Pip flinches; funny reversal", camera: "medium_action", needs: [hand_IK, weight_shift, anticipation]}
    - {id: A08, seconds: 5, beat: "Orb floats onto Pip head, lighting the cave", camera: "hero_close", needs: [prop_socket, face_light, foley]}
    - {id: A09, seconds: 4, beat: "Two characters laugh; mystery resolved", camera: "reaction_two_shot", needs: [laugh_body, mouth, ambient_audio]}
    - {id: A10, seconds: 4, beat: "A second glow appears deeper in cave; end hook", camera: "end_reveal", needs: [color_grade, foreshadowing, music_button]}
  gated_stages:
    - CHARACTER_UV_64_AND_FACE_ARTIST_REVIEW
    - EXPRESSIVE_RIG_SHOULDER_ELBOW_HAND_HIP_FOOT_QC
    - LOCKED_ORIGINAL_SCRIPT_AND_STORYBOARD
    - ORIGINAL_SFX_MUSIC_VOICE_LICENSE_AND_AUDIO_QC
    - FIRST_REAL_1080P24_30_60S_RENDER
    - HUMAN_CREATIVE_AND_COMPARABLE_METHOD_REVIEW
    - RIGHTS_QUALITY_AND_RELEASE_AUTHORIZATION
  allow_production_promotion: false
